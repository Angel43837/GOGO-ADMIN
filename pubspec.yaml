name: gogo_admin
description: "GOGO Admin - panel de administración de GOGO Food"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

# Mismas versiones que fercadi-delivery; servicios y modelos vienen de gogo_core.
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  go_router: ^14.0.0
  provider: ^6.1.2
  image_picker: ^1.1.2
  # Código compartido (servicios, modelos, core); vive en packages/gogo_core de fercadi-delivery
  gogo_core:
    git:
      url: https://github.com/Angel43837/fercadi-delivery.git
      path: packages/gogo_core
      ref: gogo-core-v1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
