name: gogo_admin
description: "GOGO Admin - panel de administración de GOGO Food"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

# Mismas versiones que fercadi-delivery, solo los paquetes que usa Admin.
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  go_router: ^14.0.0
  provider: ^6.1.2
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  image_picker: ^1.1.2
  http: ^1.2.0
  shared_preferences: ^2.3.0
  flutter_image_compress: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
